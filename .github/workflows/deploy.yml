name: Deploy Shopora

on:
  push:
    branches:
      - main

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Client Deployment
        if: ${{ secrets.VERCEL_CLIENT_DEPLOY_HOOK != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_CLIENT_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST "$DEPLOY_HOOK"

      - name: Skip Client Deployment
        if: ${{ secrets.VERCEL_CLIENT_DEPLOY_HOOK == '' }}
        run: echo "Client deploy hook not configured - skipping deployment."

  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Deployment
        if: ${{ secrets.VERCEL_SERVER_DEPLOY_HOOK != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_SERVER_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST "$DEPLOY_HOOK"

      - name: Skip Server Deployment
        if: ${{ secrets.VERCEL_SERVER_DEPLOY_HOOK == '' }}
        run: echo "Server deploy hook not configured - skipping deployment."
